# Zephyr RTOS Configuration - Spark_USB_DAC
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console (USART1 via ST-LINK VCP, routed by the board overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_NAME=y

CONFIG_NEWLIB_LIBC=y
CONFIG_PM=n

# --- I2S output: register-level circular DMA in src/i2s_out.c ----------------
# Zephyr's I2S/DMA drivers are not used (they restart DMA per block, leaving gaps).

# --- USB device (new stack) + USB Audio Class 2 -----------------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
# Windows' UAC2 driver expects a 4-byte feedback endpoint on full speed
CONFIG_USBD_UAC2_FS_WINDOWS_WORKAROUND=y

# Strings Windows shows in the sound control panel. VID/PID are the Zephyr sample
# values: fine for bench use, not for distribution.
CONFIG_SAMPLE_USBD_MANUFACTURER="BCA182"
CONFIG_SAMPLE_USBD_PRODUCT="Spark USB DAC"
# Bump the PID whenever the audio format changes: Windows caches a USB audio
# device's descriptors per VID/PID. 0x0A03 = 44.1/48/96 kHz, 24-bit.
CONFIG_SAMPLE_USBD_PID=0x0A03
CONFIG_SAMPLE_USBD_SELF_POWERED=n

# The first debug-logging run died with "Stack overflow" in the USB driver thread
# (usb@50000000), whose default stack is only 512 bytes. Raise the driver and
# USB-core thread stacks, and use the deferred logger so log output is not formatted
# on the USB thread's own stack.
# The OTG FS core has one RxFIFO for every OUT endpoint, carved from 1280 B of FIFO RAM.
# The 600 B default could not hold one 96 kHz / 24-bit packet (97 x 6 = 582 B) plus the
# next, so isochronous OUT transfers never completed. 1152 B baseline (+40 B fixed
# overhead) fits two such packets; the rest covers EP0 TX (64 B) and the 4-byte
# feedback endpoint (double-buffered, 8 B): 1192 + 64 + 8 = 1264 <= 1280.
CONFIG_UDC_STM32_OTG_RXFIFO_BASELINE_SIZE=1152
CONFIG_UDC_STM32_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_USBD_UAC2_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
