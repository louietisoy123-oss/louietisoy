; PlatformIO Project Configuration File for Spark_USB_DAC
; Target: RT-Thread RT-Spark Board (STM32F407ZGT6), second Type-C port (USB_DEVICE, PA11/PA12)
; Framework: Zephyr RTOS

[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = zephyr
upload_protocol = stlink
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -Iinclude
    -O2

check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction --inline-suppr
