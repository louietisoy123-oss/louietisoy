# Zephyr RTOS Configuration - Spark_AIrplay_1
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial (USART1 via ST-LINK VCP, routed by board overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_DMA=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Hardware FPU
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Power management must stay off: STOP mode stalls I2S DMA
CONFIG_PM=n

# ------------------------------------------------------------------------------
# Network transport (RW007 Wi-Fi -> L2 Ethernet -> BSD Sockets -> AirPlay RAOP)
# ------------------------------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_UDP_MISSING_CHECKSUM=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=2560
CONFIG_NET_TX_STACK_SIZE=2560

# Multicast IGMP enabled for mDNS 224.0.0.251
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_IPV4_ACD=n

# Network packet buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_DNS_RESOLVER=y

# Captive Portal SoftAP DHCP server
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0

# Direct Flash register access for wifi_storage.c (ARM_MPU off)
CONFIG_ARM_MPU=n

# Heap for sockets and crypto
CONFIG_HEAP_MEM_POOL_SIZE=12288

# Hardware watchdog
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# In-tree standalone mbedTLS 3.6 for AirPlay RSA and AES
# (CONFIG_MBEDTLS disabled to bypass Zephyr 4.4 tf-psa-crypto bug)
